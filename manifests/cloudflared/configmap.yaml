apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: fishing
data:
  config.yaml: |
    tunnel: d1433113-8daa-4cd4-9828-abb1455d5b40
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      # 公開サイト
      - hostname: fishing.kazuma-lab.com
        service: http://traefik.kube-system.svc.cluster.local:80
      # kube-apiserver（Cloudflare Access の Service Auth ポリシーで保護すること）
      - hostname: k8s.kazuma-lab.com
        service: tcp://kubernetes.default.svc:443
      - service: http_status:404
