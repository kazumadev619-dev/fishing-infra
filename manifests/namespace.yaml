apiVersion: v1
kind: Namespace
metadata:
  name: fishing
  labels:
    app.kubernetes.io/managed-by: fishing-infra
    # RBAC だけでは PodSpec の中身を制限できないため、PSA で privileged / hostPath /
    # hostNetwork を持つ Pod を API サーバ側で拒否する
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
